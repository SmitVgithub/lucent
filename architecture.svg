<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Gradient for main component -->
    <linearGradient id="mobileGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Icon patterns -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1E293B" text-anchor="middle">Lucent - Taxi Driver Application</text>
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Real-time Ride Sharing Architecture</text>
  
  <!-- Main Mobile App Component -->
  <g filter="url(#dropShadow)">
    <rect x="450" y="150" width="300" height="120" rx="12" fill="url(#mobileGradient)" stroke="#1D4ED8" stroke-width="2"/>
    
    <!-- Mobile phone icon -->
    <rect x="480" y="175" width="35" height="55" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="497" cy="220" r="4" fill="#FFFFFF"/>
    <line x1="490" y1="182" x2="505" y2="182" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <text x="530" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Mobile App</text>
    <text x="530" y="222" font-family="Arial, sans-serif" font-size="12" fill="#DBEAFE">Lucent Driver Application</text>
    <text x="530" y="242" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE">Real-time Ride Sharing</text>
  </g>
  
  <!-- Future Components (Placeholder boxes with dashed lines) -->
  
  <!-- API Gateway -->
  <g filter="url(#dropShadow)">
    <rect x="450" y="320" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="600" y="355" font-family="Arial, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">API Gateway</text>
    <text x="600" y="375" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">(Future Component)</text>
  </g>
  
  <!-- Connection from Mobile to API Gateway -->
  <line x1="600" y1="270" x2="600" y2="320" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Backend Services Layer -->
  <g filter="url(#dropShadow)">
    <rect x="150" y="450" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="250" y="485" font-family="Arial, sans-serif" font-size="14" fill="#8B5CF6" text-anchor="middle">Ride Service</text>
    <text x="250" y="505" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">(Future Component)</text>
  </g>
  
  <g filter="url(#dropShadow)">
    <rect x="500" y="450" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="600" y="485" font-family="Arial, sans-serif" font-size="14" fill="#8B5CF6" text-anchor="middle">Location Service</text>
    <text x="600" y="505" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">(Future Component)</text>
  </g>
  
  <g filter="url(#dropShadow)">
    <rect x="850" y="450" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="950" y="485" font-family="Arial, sans-serif" font-size="14" fill="#8B5CF6" text-anchor="middle">Payment Service</text>
    <text x="950" y="505" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">(Future Component)</text>
  </g>
  
  <!-- Connections from API Gateway to Services -->
  <path d="M 500 400 Q 350 425 250 450" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <line x1="600" y1="400" x2="600" y2="450" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 700 400 Q 850 425 950 450" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Database Layer -->
  <g filter="url(#dropShadow)">
    <ellipse cx="400" cy="620" rx="80" ry="35" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="400" y="625" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Database</text>
  </g>
  
  <g filter="url(#dropShadow)">
    <ellipse cx="800" cy="620" rx="80" ry="35" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="800" y="625" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Cache</text>
  </g>
  
  <!-- Connections to Database -->
  <line x1="250" y1="530" x2="350" y2="590" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <line x1="600" y1="530" x2="450" y2="590" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <line x1="600" y1="530" x2="750" y2="590" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <line x1="950" y1="530" x2="850" y2="590" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Legend -->
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="350" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#dropShadow)"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Legend</text>
    
    <!-- Active Component -->
    <rect x="15" y="40" width="30" height="18" rx="4" fill="url(#mobileGradient)"/>
    <text x="55" y="54" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">Active Component</text>
    
    <!-- Future Component -->
    <rect x="180" y="40" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="220" y="54" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">Future Component</text>
    
    <!-- Data Flow -->
    <line x1="15" y1="75" x2="45" y2="75" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="55" y="79" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">Data Flow</text>
    
    <!-- Planned Flow -->
    <line x1="180" y1="75" x2="210" y2="75" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="220" y="79" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">Planned Flow</text>
  </g>
  
  <!-- Layer Labels -->
  <text x="1100" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end" transform="rotate(-90, 1100, 200)">Frontend</text>
  <text x="1100" y="360" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end" transform="rotate(-90, 1100, 360)">Gateway</text>
  <text x="1100" y="490" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end" transform="rotate(-90, 1100, 490)">Services</text>
  <text x="1100" y="620" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end" transform="rotate(-90, 1100, 620)">Data</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="#3B82F6" opacity="0.05"/>
  <circle cx="1100" cy="700" r="80" fill="#10B981" opacity="0.05"/>
  <circle cx="1050" cy="150" r="40" fill="#8B5CF6" opacity="0.05"/>
</svg>