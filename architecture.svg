<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle">Secure Document Search Web Application</text>
  <text x="600" y="65" font-family="Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">HIPAA &amp; ISO 27001 Compliant Architecture</text>
  
  <!-- Compliance Badges -->
  <rect x="30" y="20" width="80" height="30" rx="4" ry="4" fill="#10B981"/>
  <text x="70" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">HIPAA</text>
  
  <rect x="120" y="20" width="90" height="30" rx="4" ry="4" fill="#8B5CF6"/>
  <text x="165" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">ISO 27001</text>
  
  <!-- Layer Labels -->
  <text x="30" y="120" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">PRESENTATION</text>
  <text x="30" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">SECURITY</text>
  <text x="30" y="470" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">APPLICATION</text>
  <text x="30" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">DATA</text>
  
  <!-- Frontend Layer -->
  <!-- Website Container -->
  <rect x="400" y="90" width="400" height="120" rx="8" ry="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Your Website</text>
  
  <!-- Embedded Web App -->
  <rect x="450" y="130" width="300" height="60" rx="8" ry="8" fill="#3B82F6"/>
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Document Search Widget</text>
  <text x="600" y="175" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE" text-anchor="middle">Embedded iframe / Web Component</text>
  
  <!-- User Icon -->
  <circle cx="200" cy="150" r="25" fill="#E0E7FF"/>
  <circle cx="200" cy="140" r="10" fill="#3B82F6"/>
  <path d="M175 170 Q200 155 225 170" stroke="#3B82F6" stroke-width="3" fill="none"/>
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">End User</text>
  
  <!-- Arrow from User to Widget -->
  <line x1="230" y1="150" x2="440" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="335" y="145" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">HTTPS</text>
  
  <!-- Security Layer -->
  <!-- WAF -->
  <rect x="200" y="270" width="180" height="80" rx="8" ry="8" fill="#F59E0B"/>
  <text x="290" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Web Application</text>
  <text x="290" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Firewall (WAF)</text>
  <text x="290" y="340" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">DDoS Protection</text>
  
  <!-- API Gateway -->
  <rect x="510" y="270" width="180" height="80" rx="8" ry="8" fill="#8B5CF6"/>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">API Gateway</text>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="11" fill="#DDD6FE" text-anchor="middle">Rate Limiting</text>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="11" fill="#DDD6FE" text-anchor="middle">Request Validation</text>
  
  <!-- Auth Service -->
  <rect x="820" y="270" width="180" height="80" rx="8" ry="8" fill="#10B981"/>
  <text x="910" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Auth Service</text>
  <text x="910" y="320" font-family="Arial, sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">OAuth 2.0 / JWT</text>
  <text x="910" y="340" font-family="Arial, sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">MFA Support</text>
  
  <!-- Arrows in Security Layer -->
  <line x1="600" y1="210" x2="600" y2="260" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="310" x2="500" y2="310" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="310" x2="810" y2="310" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Application Layer -->
  <!-- Search Service -->
  <rect x="150" y="430" width="200" height="90" rx="8" ry="8" fill="#3B82F6"/>
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Search Service</text>
  <text x="250" y="480" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE" text-anchor="middle">Full-text Search</text>
  <text x="250" y="500" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE" text-anchor="middle">Dynamic Filtering</text>
  
  <!-- Document Service -->
  <rect x="500" y="430" width="200" height="90" rx="8" ry="8" fill="#3B82F6"/>
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Document Service</text>
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE" text-anchor="middle">CRUD Operations</text>
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="11" fill="#BFDBFE" text-anchor="middle">Version Control</text>
  
  <!-- Audit Service -->
  <rect x="850" y="430" width="200" height="90" rx="8" ry="8" fill="#10B981"/>
  <text x="950" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Audit Service</text>
  <text x="950" y="480" font-family="Arial, sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">Access Logging</text>
  <text x="950" y="500" font-family="Arial, sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">Compliance Reports</text>
  
  <!-- Arrows to Application Layer -->
  <line x1="600" y1="350" x2="600" y2="420" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="380" x2="300" y2="420" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="380" x2="900" y2="420" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-green)"/>
  
  <!-- Data Layer -->
  <!-- Search Index -->
  <rect x="100" y="600" width="180" height="80" rx="8" ry="8" fill="#6366F1"/>
  <text x="190" y="630" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Search Index</text>
  <text x="190" y="655" font-family="Arial, sans-serif" font-size="11" fill="#C7D2FE" text-anchor="middle">Elasticsearch</text>
  <text x="190" y="670" font-family="Arial, sans-serif" font-size="10" fill="#C7D2FE" text-anchor="middle">Encrypted at Rest</text>
  
  <!-- Document Database -->
  <rect x="410" y="600" width="180" height="80" rx="8" ry="8" fill="#6366F1"/>
  <text x="500" y="630" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Document DB</text>
  <text x="500" y="655" font-family="Arial, sans-serif" font-size="11" fill="#C7D2FE" text-anchor="middle">PostgreSQL</text>
  <text x="500" y="670" font-family="Arial, sans-serif" font-size="10" fill="#C7D2FE" text-anchor="middle">AES-256 Encryption</text>
  
  <!-- File Storage -->
  <rect x="710" y="600" width="180" height="80" rx="8" ry="8" fill="#6366F1"/>
  <text x="800" y="630" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">File Storage</text>
  <text x="800" y="655" font-family="Arial, sans-serif" font-size="11" fill="#C7D2FE" text-anchor="middle">Object Storage</text>
  <text x="800" y="670" font-family="Arial, sans-serif" font-size="10" fill="#C7D2FE" text-anchor="middle">Server-side Encryption</text>
  
  <!-- Audit Logs -->
  <rect x="1010" y="600" width="150" height="80" rx="8" ry="8" fill="#10B981"/>
  <text x="1085" y="630" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Audit Logs</text>
  <text x="1085" y="655" font-family="Arial, sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">Immutable</text>
  <text x="1085" y="670" font-family="Arial, sans-serif" font-size="10" fill="#A7F3D0" text-anchor="middle">7-year Retention</text>
  
  <!-- Arrows to Data Layer -->
  <line x1="250" y1="520" x2="190" y2="590" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="520" x2="500" y2="590" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="520" x2="750" y2="590" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="950" y1="520" x2="1050" y2="590" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- Encryption Shield Icon -->
  <rect x="1050" y="90" width="120" height="100" rx="8" ry="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="1110" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Security</text>
  <text x="1110" y="135" font-family="Arial, sans-serif" font-size="10" fill="#B45309" text-anchor="middle">✓ TLS 1.3</text>
  <text x="1110" y="150" font-family="Arial, sans-serif" font-size="10" fill="#B45309" text-anchor="middle">✓ AES-256</text>
  <text x="1110" y="165" font-family="Arial, sans-serif" font-size="10" fill="#B45309" text-anchor="middle">✓ PHI Protected</text>
  <text x="1110" y="180" font-family="Arial, sans-serif" font-size="10" fill="#B45309" text-anchor="middle">✓ Access Control</text>
  
  <!-- Legend -->
  <rect x="30" y="720" width="300" height="60" rx="4" ry="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="45" y="740" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Legend:</text>
  <line x1="45" y1="755" x2="75" y2="755" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="85" y="760" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Data Flow</text>
  <line x1="160" y1="755" x2="190" y2="755" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-green)"/>
  <text x="200" y="760" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Audit Trail</text>
  
</svg>