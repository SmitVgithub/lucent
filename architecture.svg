<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Gradient for header -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Service gradient -->
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGradient)"/>
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">Sam's Pizza - System Architecture</text>
  <text x="600" y="55" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Project: lucent | iOS Pizza Ordering Application</text>
  
  <!-- Layer Labels -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B7280" transform="rotate(-90, 50, 150)">CLIENT LAYER</text>
  <text x="50" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B7280" transform="rotate(-90, 50, 480)">SERVICE LAYER</text>
  
  <!-- Horizontal divider lines -->
  <line x1="80" y1="320" x2="1150" y2="320" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Frontend App Component -->
  <g filter="url(#dropShadow)">
    <rect x="200" y="120" width="220" height="140" rx="12" fill="url(#serviceGradient)" stroke="#3B82F6" stroke-width="2"/>
    <rect x="200" y="120" width="220" height="35" rx="12" fill="#3B82F6"/>
    <rect x="200" y="143" width="220" height="12" fill="#3B82F6"/>
    <text x="310" y="143" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Frontend App</text>
    
    <!-- Web icon -->
    <circle cx="260" cy="200" r="20" fill="#dbeafe" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M250 200 h20 M260 190 v20 M250 195 q10 -8 20 0 M250 205 q10 8 20 0" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    
    <text x="290" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">Web Interface</text>
    <text x="290" y="210" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Pizza ordering UI</text>
    <text x="290" y="225" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">for lucent</text>
    
    <rect x="210" y="238" width="60" height="16" rx="4" fill="#dbeafe"/>
    <text x="240" y="250" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6" text-anchor="middle">SERVICE</text>
  </g>
  
  <!-- Mobile App Component -->
  <g filter="url(#dropShadow)">
    <rect x="780" y="120" width="220" height="140" rx="12" fill="url(#serviceGradient)" stroke="#10B981" stroke-width="2"/>
    <rect x="780" y="120" width="220" height="35" rx="12" fill="#10B981"/>
    <rect x="780" y="143" width="220" height="12" fill="#10B981"/>
    <text x="890" y="143" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Mobile App</text>
    
    <!-- Mobile icon -->
    <rect x="838" y="178" width="24" height="40" rx="3" fill="#d1fae5" stroke="#10B981" stroke-width="1.5"/>
    <rect x="841" y="183" width="18" height="28" fill="#10B981" opacity="0.3"/>
    <circle cx="850" cy="214" r="2" fill="#10B981"/>
    
    <text x="870" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">iOS Application</text>
    <text x="870" y="210" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">In-restaurant &</text>
    <text x="870" y="225" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Take-away orders</text>
    
    <rect x="790" y="238" width="60" height="16" rx="4" fill="#d1fae5"/>
    <text x="820" y="250" font-family="Arial, sans-serif" font-size="9" fill="#10B981" text-anchor="middle">SERVICE</text>
  </g>
  
  <!-- API Server Component -->
  <g filter="url(#dropShadow)">
    <rect x="490" y="420" width="220" height="160" rx="12" fill="url(#serviceGradient)" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="490" y="420" width="220" height="35" rx="12" fill="#8B5CF6"/>
    <rect x="490" y="443" width="220" height="12" fill="#8B5CF6"/>
    <text x="600" y="443" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">API Server</text>
    
    <!-- Server icon -->
    <rect x="520" y="475" width="40" height="10" rx="2" fill="#ede9fe" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="520" y="488" width="40" height="10" rx="2" fill="#ede9fe" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="520" y="501" width="40" height="10" rx="2" fill="#ede9fe" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="528" cy="480" r="2" fill="#10B981"/>
    <circle cx="528" cy="493" r="2" fill="#10B981"/>
    <circle cx="528" cy="506" r="2" fill="#10B981"/>
    
    <text x="570" y="485" font-family="Arial, sans-serif" font-size="11" fill="#374151">Backend API</text>
    <text x="570" y="500" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Order processing</text>
    <text x="570" y="515" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Menu management</text>
    <text x="570" y="530" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">for lucent</text>
    
    <rect x="500" y="548" width="60" height="16" rx="4" fill="#ede9fe"/>
    <text x="530" y="560" font-family="Arial, sans-serif" font-size="9" fill="#8B5CF6" text-anchor="middle">SERVICE</text>
  </g>
  
  <!-- Connection: Frontend to API Server -->
  <path d="M 310 260 L 310 350 Q 310 370 330 370 L 570 370 Q 590 370 590 390 L 590 420" 
        stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Connection label -->
  <rect x="360" y="355" width="100" height="22" rx="4" fill="white" stroke="#e5e7eb"/>
  <text x="410" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">User requests</text>
  
  <!-- Connection: Mobile to API Server (implied) -->
  <path d="M 890 260 L 890 350 Q 890 370 870 370 L 630 370 Q 610 370 610 390 L 610 420" 
        stroke="#6B7280" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  
  <!-- Connection label for mobile -->
  <rect x="700" y="355" width="100" height="22" rx="4" fill="white" stroke="#e5e7eb"/>
  <text x="750" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">API calls</text>
  
  <!-- Legend -->
  <g transform="translate(900, 620)">
    <rect x="0" y="0" width="250" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#dropShadow)"/>
    <text x="125" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Legend</text>
    <line x1="20" y1="35" x2="230" y2="35" stroke="#e5e7eb"/>
    
    <!-- Frontend service -->
    <rect x="20" y="50" width="20" height="14" rx="3" fill="#3B82F6"/>
    <text x="50" y="61" font-family="Arial, sans-serif" font-size="11" fill="#374151">Frontend Service</text>
    
    <!-- Mobile service -->
    <rect x="20" y="75" width="20" height="14" rx="3" fill="#10B981"/>
    <text x="50" y="86" font-family="Arial, sans-serif" font-size="11" fill="#374151">Mobile Service</text>
    
    <!-- API service -->
    <rect x="20" y="100" width="20" height="14" rx="3" fill="#8B5CF6"/>
    <text x="50" y="111" font-family="Arial, sans-serif" font-size="11" fill="#374151">API Service</text>
    
    <!-- Data flow -->
    <line x1="140" y1="57" x2="180" y2="57" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="190" y="61" font-family="Arial, sans-serif" font-size="11" fill="#374151">Data Flow</text>
    
    <!-- Implied connection -->
    <line x1="140" y1="82" x2="180" y2="82" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="190" y="86" font-family="Arial, sans-serif" font-size="11" fill="#374151">Implied</text>
  </g>
  
  <!-- Order Types Info Box -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#dropShadow)"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Order Types</text>
    <line x1="20" y1="35" x2="260" y2="35" stroke="#e5e7eb"/>
    
    <!-- In Restaurant -->
    <circle cx="35" cy="60" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="35" y="64" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">🍽</text>
    <text x="55" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">In Restaurant</text>
    <text x="55" y="72" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Dine-in orders</text>
    
    <!-- Take Away -->
    <circle cx="35" cy="105" r="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="109" font-family="Arial, sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">📦</text>
    <text x="55" y="103" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">Take Away</text>
    <text x="55" y="117" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Pickup orders</text>
    
    <!-- No delivery note -->
    <text x="180" y="80" font-family="Arial, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">No home delivery</text>
    <text x="180" y="95" font-family="Arial, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">available</text>
  </g>